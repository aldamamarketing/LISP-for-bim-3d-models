<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SaaS Standards Palette</title>
    <!-- Mismo estilo base que las otras paletas -->
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #181818;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden; /* CefSharp maneja el scroll internamente en react-window si es necesario, pero overflow-y auto en el contenedor */
      }
      :root {
        --tmd-orange: #f26d21;
        --text-muted: #888;
      }
      * {
        box-sizing: border-box;
      }
      /* Custom Scrollbar (mismo tema oscuro) */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #181818;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #444;
      }
    </style>
