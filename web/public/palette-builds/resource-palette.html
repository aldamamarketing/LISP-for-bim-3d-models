he Loader.","help.sec1.li1":"Log in to the Client Portal.","help.sec1.li2":"Navigate to the Licenses & Access tab.","help.sec1.li3":"Scroll to 'Your Access Key' and click Download.","help.sec1.li4":"In AutoCAD, type the APPLOAD command.","help.sec1.li5":"Select the downloaded file and click Load.","help.sec1.li6":"To load automatically when opening AutoCAD, add it to the Startup Suite in the same APPLOAD window.","help.sec2.title":"Managing Scripts","help.sec2.p1":"Your .lsp files are securely stored in the cloud and downloaded into memory only when needed (JIT).","help.sec2.li1":"Upload: In the Portal, go to LISP Manager and click '+ Add LISPs'. You can select multiple files at once.","help.sec2.li2":"Edit Metadata: Click the pencil icon next to a routine to change its Friendly Name, Suite, and Icon.","help.sec2.li3":"Remove: Click the trash icon to delete the routine from your Workspace. Changes reflect in AutoCAD on the next load.","help.box5.title":"LISP Best Practices","help.box5.desc":"Learn how to structure your code for JIT delivery and manage dependencies with LC:Require.","help.sec3.title":"Best Practices & Dependencies","help.sec3.p1":"To align your legacy code to the cloud architecture and leverage Just-In-Time (JIT) loading, follow these rules:","help.sec3.li1":"Centralize Logic: A downloaded file loads all its internal commands into memory instantly. Group related commands.","help.sec3.li2":'LC:Require: If a script depends on another (e.g. math library), use `(LC:Require "LibraryName")` at the top of your LISP.',"help.sec3.li3":"Suite Permissions: The main file and its dependencies MUST belong to the same Suite in LispCentral to pass DRM checks.","dashboard.sidebar.manager":"LISP Manager","dashboard.sidebar.collection":"My Collection","dashboard.sidebar.profile":"My Profile","dashboard.sidebar.licenses":"Licenses & Access","dashboard.sidebar.notifications":"Notifications","dashboard.sidebar.reportBug":"Report Bug","dashboard.sidebar.logout":"Sign Out",
