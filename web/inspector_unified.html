<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>LispCentral Command Palette</title>
  <!-- Google Fonts Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <!-- AutoCAD Native JSAPI -->
  <script type="text/javascript" src="https://df-prod.autocad360.com/jsapi/v4/Autodesk.AutoCAD.js"></script>
  
  <style>
    :root {
      --bg-color: #121212;
      --header-bg: #1e1e1e;
      --panel-bg: #2d2d2d;
      --panel-border: rgba(255, 255, 255, 0.05);
      --accent-color: #f26d21; /* TMD Orange */
      --accent-glow: rgba(242, 109, 33, 0.2);
      --text-main: #f0f0f0;
      --text-muted: #aaaaaa;
      --success-color: #10b981;
      --error-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100vh;
      overflow: hidden;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      padding: 12px;
      box-sizing: border-box;
    }

    /* Estilo de la Barra de Búsqueda Premium (Spotlight Style) */
    .search-container {
      position: relative;
      margin-bottom: 20px;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      outline: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .search-input:focus {
      border-color: var(--accent-color);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 15px var(--accent-glow), inset 0 2px 4px rgba(0, 0, 0, 0.2);
    }

    .search-input:focus-visible,
    .module-item:focus-visible,
    .docs-btn:focus-visible,
    .pin-btn:focus-visible {
      outline: 2px solid var(--accent-color);
      outline-offset: 2px;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      fill: var(--text-muted);
      transition: fill 0.3s ease;
      pointer-events: none;
    }

    .search-input:focus + .search-icon {
      fill: var(--accent-color);
    }

    /* Estatus de la Carga Asíncrona */
    .status-panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
      transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      max-height: 100px;
      opacity: 1;
      overflow: hidden;
    }

    .status-panel.hidden {
      max-height: 0;
      opacity: 0;
      padding: 0;
      margin-bottom: 0;
      border: none;
    }

    .status-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .status-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-value {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent-color);
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent-color) 0%, #ff8c00 100%);
      box-shadow: 0 0 10px var(--accent-glow);
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Módulos en la Lista */
    .modules-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
    }

    /* Scrollbar Personalizado */
    .modules-list::-webkit-scrollbar {
      width: 6px;
    }
    .modules-list::-webkit-scrollbar-track {
      background: transparent;
    }
    .modules-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }

    /* Cabeceras de Agrupamiento */
    .group-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 4px 4px 4px;
      margin-top: 10px;
    }

    .group-header span:first-child {
      font-size: 10px;
      font-weight: 700;
      color: var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border-left: 2px solid var(--accent-color);
      padding-left: 6px;
    }

    .group-count {
      font-size: 9px;
      font-weight: 700;
      background: rgba(255, 215, 0, 0.08);
      color: var(--accent-color);
      border: 1px solid rgba(255, 215, 0, 0.15);
      padding: 1px 5px;
      border-radius: 6px;
    }

    .group-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 6px;
      margin-top: 8px;
      width: 100%;
    }

    .module-item {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 6px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 48px; /* Altura fija */
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      cursor: pointer;
      overflow: hidden;
    }

    .module-item:hover {
      background: #252525;
      border-color: var(--accent-color);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .module-info-col {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
      flex: 1;
      min-width: 0;
    }

    .module-name-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    /* Icono SVG de 16x16 exacto */
    .module-icon-container {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--accent-color);
    }
    
    .module-icon-container svg {
      width: 16px;
      height: 16px;
      display: block;
    }

    .module-name {
      font-family: monospace;
      font-size: 11px;
      font-weight: bold;
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .module-friendly-name {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-left: 22px; /* Alineado con el inicio del texto del comando */
    }

    /* Acciones organizadas en vertical: Pin arriba, Ayuda abajo */
    .module-actions-col {
      display: flex;
      flex-direction: column;
      gap: 2px;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-left: 6px;
    }

    .docs-btn, .pin-btn {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      font-family: 'Outfit', sans-serif;
      font-size: 10px;
      font-weight: bold;
      width: 17px;
      height: 17px;
      display: none; /* Oculto por defecto, se muestra en hover del card */
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .module-item:hover .docs-btn, 
    .module-item:hover .pin-btn,
    .pin-btn.pinned {
      display: flex;
    }

    .docs-btn:hover, .pin-btn:hover {
      border-color: var(--accent-color);
      color: var(--accent-color);
      background: var(--accent-glow);
    }
    
    .pin-btn.pinned {
      color: var(--accent-color);
      border-color: var(--accent-color);
      background: rgba(242, 109, 33, 0.15);
    }

    /* Estilos para Chips de Búsqueda */
    .chips-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .search-chip {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .search-chip:hover {
      background: rgba(242, 109, 33, 0.2);
      border-color: var(--accent-color);
    }

    .search-chip-close {
      color: var(--accent-color);
      font-weight: bold;
    }

    /* Estados de Carga reflejados en el borde de la tarjeta */
    .module-item.loading {
      border-color: var(--accent-color) !important;
      animation: borderPulse 1.5s infinite ease-in-out;
    }

    .module-item.success {
      border-color: var(--success-color) !important;
      box-shadow: 0 0 4px rgba(16, 185, 129, 0.15);
    }

    .module-item.error {
      border-color: var(--error-color) !important;
      box-shadow: 0 0 4px rgba(239, 68, 68, 0.15);
    }

    @keyframes borderPulse {
      0%, 100% { box-shadow: 0 0 2px var(--accent-glow); }
      50% { box-shadow: 0 0 8px var(--accent-glow); }
    }

    /* Reset/Footer */
    .palette-footer {
      margin-top: auto;
      padding-top: 16px;
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      border-top: 1px solid var(--panel-border);
    }
  </style>
</head>
<body>

  <!-- Spotlight Search & Chips -->
  <div class="search-container">
    <input type="text" class="search-input" id="searchInput" placeholder="Escriba tags (ej: arq, pared) y presione Enter" aria-label="Escriba tags para buscar herramientas">
    <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
    </svg>
    <div class="chips-container" id="chipsContainer"></div>
  </div>

  <!-- Favoritos -->
  <div id="favoritesSection" style="display: none; margin-bottom: 20px;">
    <div class="group-header">
      <span>FAVORITOS (PINNED)</span>
    </div>
    <div class="group-container" id="favoritesList"></div>
  </div>

  <!-- Estatus del Sincronizador -->
  <div class="status-panel">
    <div class="status-header">
      <span class="status-title">Sincronizando RAM</span>
      <span class="status-value" id="progressVal">0%</span>
    </div>
    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
  </div>

  <!-- Lista de Comandos -->
  <div class="modules-list" id="modulesList">
    <!-- Carga inicial dinámica vía JavaScript -->
  </div>

  <div class="palette-footer">
    LISPCENTRAL CLOUD COMMAND PALETTE v3.4
  </div>

  <!-- Carga del Puente JavaScript -->
  <script src="palette_unified.js"></script>
</body>
</html>
