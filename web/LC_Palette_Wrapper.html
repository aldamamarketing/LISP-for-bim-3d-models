<script>
window.addEventListener('message', function(event) {
  if (event.data && event.data.type === 'ACAD_COMMAND') {
    var cmd = event.data.command + '\n';
    console.log('[Wrapper Local] Intentando ejecutar:', cmd);
    if (typeof Acad !== 'undefined' && Acad.Editor) {
      console.log('[Wrapper Local] Usando Acad.Editor.executeCommand');
      if (Acad.Editor.executeCommandAsync) { Acad.Editor.executeCommandAsync(cmd); }
      else if (Acad.Editor.executeCommand) { Acad.Editor.executeCommand(cmd); }
    } else if (typeof exec !== 'undefined') {
      console.log('[Wrapper Local] Usando exec() legacy');
      exec(JSON.stringify({functionName: 'Ac_EditorInterop.executeCommand', functionParams: { commands: cmd }}));
    } else if (typeof execAsync !== 'undefined') {
      console.log('[Wrapper Local] Usando execAsync() legacy');
      execAsync(JSON.stringify({functionName: 'Ac_EditorInterop.executeCommand', functionParams: { commands: cmd }}));
    } else {
      console.error('LispCentral Bridge: exec no encontrado en entorno local');
    }
  }
});
</script></body></html>
