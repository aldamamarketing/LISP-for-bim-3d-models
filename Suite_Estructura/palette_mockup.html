<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LispCentral - Estructura 2D</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #2b2b2b; color: #f0f0f0; margin: 0; padding: 10px; font-size: 14px; }
        .tab-container { display: flex; border-bottom: 1px solid #444; margin-bottom: 10px; }
        .tab { padding: 8px 15px; cursor: pointer; border: 1px solid transparent; }
        .tab.active { background-color: #3f3f3f; border-bottom: 2px solid #00a8ff; font-weight: bold; }
        .panel { display: none; padding: 10px; background-color: #333; border-radius: 4px; }
        .panel.active { display: block; }
        select, button { width: 100%; padding: 8px; margin-bottom: 10px; background-color: #444; color: white; border: 1px solid #555; border-radius: 4px; }
        button { background-color: #007acc; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background-color: #0098ff; }
        .section-title { font-size: 12px; color: #aaa; text-transform: uppercase; margin-bottom: 5px; }
        #bom-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        #bom-table th, #bom-table td { border: 1px solid #555; padding: 5px; text-align: left; }
        #bom-table th { background-color: #444; }
    </style>
</head>
<body>

    <div class="tab-container">
        <div class="tab active" onclick="switchTab('draw')">⚙️ Perfiles</div>
        <div class="tab" onclick="switchTab('data')">📊 Datos & BOM</div>
    </div>

    <!-- PESTAÑA DE MODELADO -->
    <div id="panel-draw" class="panel active">
        <div class="section-title">Catálogo en la Nube (Firebase)</div>
        <select id="sel-familia">
            <option value="W">Vigas (Sección W)</option>
            <option value="H">Columnas (Sección H)</option>
            <option value="C">Canales (Sección C)</option>
        </select>

        <select id="sel-perfil">
            <!-- Esto se llenaría asíncronamente vía JS -->
            <option value="W12x26">W12x26</option>
            <option value="W14x30">W14x30</option>
            <option value="W16x40">W16x40</option>
        </select>

        <div class="section-title">Vista de Inserción</div>
        <select id="sel-vista">
            <option value="TOP">Planta (Top)</option>
            <option value="FRONT">Elevación (Front)</option>
            <option value="SECTION">Corte (Section)</option>
        </select>

        <button onclick="drawSteelProfile()">✏️ DIBUJAR PERFIL</button>
        <button style="background-color: #555;">🔗 MATCH PROPERTIES</button>
    </div>

    <!-- PESTAÑA DE DATOS Y CÁLCULOS -->
    <div id="panel-data" class="panel">
        <button onclick="calculateBOM()" style="background-color: #28a745;">📋 GENERAR TABLA BOM</button>

        <div class="section-title">Resultados de Cubicación</div>
        <table id="bom-table">
            <thead>
                <tr>
                    <th>Perfil</th>
                    <th>Long. (m)</th>
                    <th>Peso (kg)</th>
                </tr>
            </thead>
            <tbody id="bom-body">
                <!-- Se llena con JS tras leer el JSON exportado por LISP -->
                <tr><td colspan="3" style="text-align: center; color:#aaa;">(Tabla vacía)</td></tr>
            </tbody>
        </table>
    </div>

    <script src="main_loader.js"></script>
</body>
</html>
