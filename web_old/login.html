<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - LispCentral</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .auth-container { max-width: 400px; margin: 80px auto; }
    .switch-mode { color: var(--tmd-orange); cursor: pointer; font-size: 0.9rem; text-decoration: underline; margin-top: 15px; display: inline-block; }
  </style>
</head>
<body>

  <header>
    <div class="logo">Lisp<span>Central</span></div>
    <nav>
      <a href="/index.html" class="btn btn-secondary" style="border:none;">Home</a>
      <a href="/docs/index.html" class="btn btn-secondary" style="border:none;">Documentação</a>
    </nav>
  </header>

  <main class="section auth-container">
    <div class="card">
      <h2 id="formTitle">Entrar no Painel</h2>
      <p id="formSubtitle" style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px;">Acesse suas chaves de API e assinaturas.</p>
      
      <form id="authForm">
        <div class="form-group">
          <label for="email">E-mail corporativo</label>
          <input type="email" id="email" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" class="form-control" required minlength="6">
        </div>
        <button type="submit" id="submitBtn" class="btn" style="width: 100%;">Entrar</button>
        <div id="errorMsg" style="color: #ff4a4a; font-size: 0.9rem; margin-top: 10px; display: none;"></div>
      </form>
      
      <div style="text-align: center;">
        <span class="switch-mode" id="switchBtn">Não tem conta? Criar uma nova</span>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 LispCentral. Todos os direitos reservados.</p>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      projectId: "lispcentral",
      appId: "1:439823418692:web:e217acb7877c16cc438311",
      storageBucket: "lispcentral.firebasestorage.app",
      apiKey: "AIzaSyADsqbH_lKKFcugqTexryO40u5VMJxzx0c",
      authDomain: "lispcentral.firebaseapp.com",
      messagingSenderId: "439823418692"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (user) window.location.href = "/dashboard.html";
    });

    let isLogin = true;
    const formTitle = document.getElementById('formTitle');
    const formSubtitle = document.getElementById('formSubtitle');
    const submitBtn = document.getElementById('submitBtn');
    const switchBtn = document.getElementById('switchBtn');
    const errorMsg = document.getElementById('errorMsg');

    switchBtn.addEventListener('click', () => {
      isLogin = !isLogin;
      errorMsg.style.display = 'none';
      if(isLogin) {
        formTitle.innerText = "Entrar no Painel";
        formSubtitle.innerText = "Acesse suas chaves de API e assinaturas.";
        submitBtn.innerText = "Entrar";
        switchBtn.innerText = "Não tem conta? Criar uma nova";
      } else {
        formTitle.innerText = "Criar Conta";
        formSubtitle.innerText = "Cadastre-se para obter sua chave de testes.";
        submitBtn.innerText = "Cadastrar";
        switchBtn.innerText = "Já tem uma conta? Entrar";
      }
    });

    document.getElementById('authForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      errorMsg.style.display = 'none';
      submitBtn.innerText = "Aguarde...";

      if(isLogin) {
        signInWithEmailAndPassword(auth, email, password)
          .catch((error) => {
            errorMsg.innerText = "Erro: " + error.message;
            errorMsg.style.display = 'block';
            submitBtn.innerText = "Entrar";
          });
      } else {
        createUserWithEmailAndPassword(auth, email, password)
          .catch((error) => {
            errorMsg.innerText = "Erro: " + error.message;
            errorMsg.style.display = 'block';
            submitBtn.innerText = "Cadastrar";
          });
      }
    });
  </script>
</body>
</html>
