<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AutoCAD Simulator</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #222; color: white; font-family: sans-serif; }
        iframe { width: 100%; height: calc(100% - 40px); border: none; }
        #log { height: 40px; background: #333; line-height: 40px; padding-left: 15px; border-bottom: 2px solid #555; font-size: 14px;}
    </style>
</head>
<body>
    <div id="log">Esperando comandos de AutoCAD... (Abre esta página en el navegador)</div>
    <!-- Cambiada la URL para que funcione con el servidor local de Astro sin los rewrites de Firebase -->
    <iframe src="http://localhost:4321/palette-builds/palette.html" allow="clipboard-read; clipboard-write"></iframe>
    <script>
        window.addEventListener('message', function(event) {
            // Simulamos que este HTML es el "Local Wrapper" inyectado por LISP
            if (event.data && event.data.type === 'ACAD_COMMAND') {
                const cmd = event.data.command;
                
                // Mostrar visualmente en la barra superior
                const logDiv = document.getElementById('log');
                logDiv.innerHTML = `<span style="color: #4CAF50;">✅ [AutoCAD SIMULADO] Comando Recibido y Listo para Ejecutar: </span> <b style="color: #FFC107;">${cmd}</b>`;
                
                // Mostrar en la consola del navegador
                console.log("%c[AutoCAD Simulado]%c Ejecutando comando:", "color: #4CAF50; font-weight: bold", "color: inherit", cmd);
            }
        });
    </script>
</body>
</html>
