<style>
        .custom-hatch-pattern {
            background-image: linear-gradient(45deg, #ff6b00 25%, transparent 25%, transparent 50%, #ff6b00 50%, #ff6b00 75%, transparent 75%, transparent);
            background-size: 10px 10px;
            opacity: 0.8;
        }
        .custom-hatch-pattern-2 {
            background-image: radial-gradient(#ff6b00 15%, transparent 16%), radial-gradient(#ff6b00 15%, transparent 16%);
            background-size: 12px 12px;
            background-position: 0 0, 6px 6px;
            opacity: 0.8;
        }
        .custom-hatch-pattern-3 {
            background-image: linear-gradient(0deg, transparent 24%, rgba(255, 107, 0, .3) 25%, rgba(255, 107, 0, .3) 26%, transparent 27%, transparent 74%, rgba(255, 107, 0, .3) 75%, rgba(255, 107, 0, .3) 76%, transparent 77%, transparent), linear-gradient(90deg, transparent 24%, rgba(255, 107, 0, .3) 25%, rgba(255, 107, 0, .3) 26%, transparent 27%, transparent 74%, rgba(255, 107, 0, .3) 75%, rgba(255, 107, 0, .3) 76%, transparent 77%, transparent);
            background-size: 20px 20px;
        }
        .custom-hatch-pattern-4 {
             background: repeating-linear-gradient(
                -45deg,
                transparent,
                transparent 5px,
                #ff6b00 5px,
                #ff6b00 6px
            );
            opacity: 0.8;
        }
        
        .line-dashed {
            border-bottom: 2px dashed #ffb693;
        }
        .line-dotted {
            border-bottom: 2px dotted #ffb693;
        }
        .line-dashdot {
            border-bottom: 2px solid #ffb693;
            border-image: repeating-linear-gradient(to right, #ffb693 0 10px, transparent 10px 15px, #ffb693 15px 20px, transparent 20px 25px) 1;
        }

        /* Hide scrollbar for clean UI */
        ::-webkit-scrollbar {
            display: none;
        }
        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md antialiased min-h-screen flex flex-col md:hidden">
<!-- TopAppBar Semantic Shell Override - Direct Navigation Focus -->
<header class="bg-surface dark:bg-surface w-full top-0 sticky z-50 flex justify-between items-center px-margin-mobile h-16 shadow-[0_1px_0_0_rgba(255,255,255,0.05)]">
<div class="flex items-center gap-2">
<button aria-label="Volver" class="text-on-surface-variant hover:text-primary transition-colors active:scale-95 flex items-center justify-center p-2 -ml-2 rounded-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div class="flex items-center gap-1 text-label-md font-label-md">
<span class="text-on-surface-variant">Panel</span>
<span class="material-symbols-outlined text-[16px] text-surface-variant">chevron_right</span>
<span class="text-primary font-bold">Biblioteca</span>
</div>
</div>
<button aria-label="Opciones" class="text-on-surface-variant hover:text-primary transition-colors active:scale-95">
<span class="material-symbols-outlined">more_vert</span>
</button>
</header>
<main class="flex-grow flex flex-col pb-[100px]">
<!-- Hero Reference Image Section -->
<section class="px-margin-mobile pt-unit pb-gutter">
<div class="relative w-full h-[120px] rounded-lg overflow-hidden border border-surface-variant">
<img alt="" class="w-full h-full object-cover opacity-50 grayscale hover:grayscale-0 transition-all duration-500" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAI5jzoW87IUu4OCyYSMF_eCs65MiIjd-GPbX0538WsZ5a4aJCzpLdUJZtBoQF6BmYSzrg3kjuJQ70kmkqA2aLSU7r-jAU-20RzGgivL8icpBt30b9pIiNjKMyNunrFu7ik9dEJFD4IjdZsfZM9jlZpp4QuVQVA9NMl_BcEUxgazU9hascrigI-Gaw8Ksz8jRfJMHOf0eGUg8qoriWZ3o7Y9V8S3VnxP-XnGx86TFutB-gz-yJv7MKRNmft5qEmxl0KF83oRgWSLhY"/>
<div class="absolute inset-0 bg-gradient-to-t from-background to-transparent"></div>
<div class="absolute bottom-4 left-4">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface font-bold">Recursos CAD</h1>
<p class="font-label-md text-label-md text-on-surface-variant">Hatches &amp; Linhas</p>
</div>
</div>
</section>
<!-- Hatches Section (Bento Grid Style) -->
<section class="px-margin-mobile flex flex-col gap-unit mb-section-padding">
<div class="flex justify-between items-end mb-2">
<h2 class="font-headline-md text-headline-md text-on-surface">Hatches</h2>
<span class="font-code-sm text-code-sm text-primary">.PAT</span>
</div>
<div class="grid grid-cols-2 gap-unit">
<!-- Hatch Card 1 -->
<div class="bg-[#141414] border border-[#262626] rounded-lg p-unit flex flex-col gap-2 relative group hover:border-primary-container transition-colors">
<div class="w-full h-[80px] bg-surface-container-lowest rounded flex items-center justify-center overflow-hidden border border-surface-variant">
<div class="w-full h-full custom-hatch-pattern"></div>
</div>
<div class="flex justify-between items-center px-1">
<span class="font-code-sm text-code-sm text-on-surface">ANSI31</span>
<button aria-label="Favoritar" class="text-surface-variant hover:text-primary-container active:scale-90 transition-all">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1; color: #ff6b00;">star</span>
</button>
</div>
</div>
<!-- Hatch Card 2 -->
<div class="bg-[#141414] border border-[#262626] rounded-lg p-unit flex flex-col gap-2 relative group hover:border-primary-container transition-colors">
<div class="w-full h-[80px] bg-surface-container-lowest rounded flex items-center justify-center overflow-hidden border border-surface-variant">
<div class="w-full h-full custom-hatch-pattern-2"></div>
</div>
<div class="flex justify-between items-center px-1">
<span class="font-code-sm text-code-sm text-on-surface">DOTS</span>
<button aria-label="Favoritar" class="text-surface-variant hover:text-primary-container active:scale-90 transition-all">
<span class="material-symbols-outlined text-[20px]">star</span>
</button>
</div>
</div>
<!-- Hatch Card 3 -->

<div class="w-full h-[80px] bg-surface-container-lowest rounded flex items-center justify-center overflow-hidden border border-surface-variant">
<div class="w-full h-full custom-hatch-pattern-3"></div>
</div>
<div class="flex justify-between items-center px-1">
<span class="font-code-sm text-code-sm text-on-surface">NET</span>
<button aria-label="Favoritar" class="text-surface-variant hover:text-primary-container active:scale-90 transition-all">
<span class="material-symbols-outlined text-[20px]">star</span>
</button>
</div>
</div>
<!-- Hatch Card 4 -->
<div class="bg-[#141414] border border-[#262626] rounded-lg p-unit flex flex-col gap-2 relative group hover:border-primary-container transition-colors">
<div class="w-full h-[80px] bg-surface-container-lowest rounded flex items-center justify-center overflow-hidden border border-surface-variant">
<div class="w-full h-full custom-hatch-pattern-4"></div>
</div>
<div class="flex justify-between items-center px-1">
<span class="font-code-sm text-code-sm text-on-surface">DIAG</span>
<button aria-label="Favoritar" class="text-surface-variant hover:text-primary-container active:scale-90 transition-all">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1; color: #ff6b00;">star</span>
</button>
</div>
</div>
</div>
</section>
<!-- Lines Section (List Style) -->
<section class="px-margin-mobile flex flex-col gap-unit">
<div class="flex justify-between items-end mb-2">
<h2 class="font-headline-md text-headline-md text-on-surface">Linhas CAD</h2>
<span class="font-code-sm text-code-sm text-primary">.LIN</span>
</div>
<div class="flex flex-col gap-2">
<!-- Line Item 1 -->
<div class="bg-[#141414] border border-[#262626] rounded-lg p-3 flex items-center justify-between">
<div class="flex flex-col gap-2 flex-grow pr-4">
<span class="font-code-sm text-code-sm text-on-surface">DASHED</span>
<div class="w-full line-dashed h-1"></div>
</div>
<!-- Custom Toggle Switch -->
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary-container"></div>
</label>
</div>
<!-- Line Item 2 -->
<div class="bg-[#141414] border border-[#262626] rounded-lg p-3 flex items-center justify-between">
<div class="flex flex-col gap-2 flex-grow pr-4">
<span class="font-code-sm text-code-sm text-on-surface">HIDDEN</span>
<div class="w-full line-dashed h-1" style="border-bottom-width: 1px; border-bottom-color: #e2bfb0;"></div>
</div>
<!-- Custom Toggle Switch -->
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-on-surface-variant after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary-container"></div>
</label>
</div>
<!-- Line Item 3 -->
<div class="bg-[#141414] border border-[#262626] rounded-lg p-3 flex items-center justify-between">
<div class="flex flex-col gap-2 flex-grow pr-4">
<span class="font-code-sm text-code-sm text-on-surface">CENTER</span>
<div class="w-full line-dashdot h-1"></div>
</div>
<!-- Custom Toggle Switch -->
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary-container"></div>
</label>
</div>
</div>
</section>
</main>
<!-- Sync Toast Notification (Fixed to bottom above safe area) -->
<div class="fixed bottom-[24px] left-1/2 transform -translate-x-1/2 w-[90%] max-w-sm z-50">
<div class="bg-[#1a1c1c] border border-primary-container/30 text-on-surface rounded-full px-4 py-3 flex items-center gap-3 shadow-lg shadow-black/50 backdrop-blur-sm">
<span class="material-symbols-outlined text-primary-container text-[20px]">sync</span>
<span class="font-label-md text-label-md">Sincronizado com AutoCAD em tempo real</span>
</div>
</div>
</body></html>
